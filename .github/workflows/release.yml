name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без ведущей v, например 0.2.0'
        required: true
        default: '0.2.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          # macos-14 — ARM64-раннер; отдельная x86_64-сборка появится позже.
          - os: macos-14
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Некорректная версия: $raw" >&2
            exit 1
          fi
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DFM_VERSION=${{ steps.version.outputs.value }}"
          "-DFM_PLATFORM=${{ matrix.platform }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --target package --config Release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: build/package/funcmath-ds-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # Ручной запуск собирает артефакты, но не публикует релиз.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: funcmath-ds ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
